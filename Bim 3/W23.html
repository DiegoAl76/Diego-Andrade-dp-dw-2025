<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Card de Produto</title>
  <link rel="stylesheet" href="style23.css">
</head>
<body>

  <div class="product-card">
    <img src="img/tenis.jpg" alt="Tênis Esportivo" class="product-image">
    <div class="product-info">
      <h2 class="product-title">Tênis Esportivo</h2>
      <p class="product-description">
        Tênis confortável para corridas e treinos diários.
      </p>
      <button class="product-button">Comprar</button>
    </div>
  </div>

</body>
</html>
