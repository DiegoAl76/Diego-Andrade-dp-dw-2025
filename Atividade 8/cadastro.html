<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>
<body>

    <h1>Formulário de Cadastro</h1>

    <form action="#" method="post">

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required><br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade"><br><br>

        <label for="estado">Estado:</label><br>
        <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="BA">Bahia</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RN">Rio Grande do Norte</option>
        </select><br><br>

        <p>Gênero:</p>
        <input type="radio" id="masculino" name="genero" value="Masculino">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="feminino" name="genero" value="Feminino">
        <label for="feminino">Feminino</label><br>
        <input type="radio" id="outro" name="genero" value="Outro">
        <label for="outro">Outro</label><br><br>

        <p>Interesses:</p>
        <input type="checkbox" id="tecnologia" name="interesse" value="Tecnologia">
        <label for="tecnologia">Tecnologia</label><br>
        <input type="checkbox" id="esportes" name="interesse" value="Esportes">
        <label for="esportes">Esportes</label><br>
        <input type="checkbox" id="musica" name="interesse" value="Música">
        <label for="musica">Música</label><br><br>

        <input type="submit" value="Enviar Cadastro">

    </form>

</body>
</html>
