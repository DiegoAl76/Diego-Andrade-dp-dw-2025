<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Contato</title>
</head>
<body>

    <h1>Rascunho</h1>

    <form>
        Nome:<br>
        <input type="text" name="nome"><br><br>

        E-mail:<br>
        <input type="email" name="email"><br><br>

        Mensagem:<br>
        <textarea name="mensagem" rows="5" cols="19"></textarea><br><br>

        <input type="submit" value="Enviar">
    </form>

</body>
</html>
